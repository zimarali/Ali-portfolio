<!doctype html>
<html lang="en" data-theme="delivery">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ramiz Ali</title>
  <meta name="description" content="Ramiz Ali">
  <meta name="theme-color" content="#f1e6d6">
  <meta property="og:title" content="Ramiz Ali">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='6' width='52' height='52' rx='16' fill='%23e8573f'/%3E%3Ccircle cx='32' cy='32' r='11' fill='%23fff3e2'/%3E%3C/svg%3E">
  <!-- The import map must come before any module script or modulepreload (Firefox enforces this). -->
  <script type="importmap">{ "imports": { "three": "./vendor/three.min.js" } }</script>
  <link rel="modulepreload" href="vendor/three.min.js">
  <link rel="stylesheet" href="styles.css">
  <noscript><style>.controls { display: none; }</style></noscript>
</head>
<body>
  <main class="stage" id="stage">
    <h1 class="name">
      <span class="name__text">Ramiz Ali</span>
      <span class="name__toy" aria-hidden="true"><span>R</span><span>a</span><span>m</span><span>i</span><span>z</span><span class="gap"> </span><span>A</span><span>l</span><span>i</span></span>
    </h1>
    <canvas class="stage__canvas" aria-hidden="true"></canvas>
  </main>

  <div class="controls">
    <button type="button" class="ctl" id="sound" aria-label="Turn sound on" aria-pressed="false" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        <path class="ico-on" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.6 7.6 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path class="ico-off" d="M16 9.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
    <button type="button" class="ctl" id="another" aria-label="Show another scene">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <rect x="3.5" y="3.5" width="17" height="17" rx="5" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <circle cx="8.6" cy="8.6" r="1.55" fill="currentColor"/>
        <circle cx="12" cy="12" r="1.55" fill="currentColor"/>
        <circle cx="15.4" cy="15.4" r="1.55" fill="currentColor"/>
      </svg>
    </button>
  </div>

  <p class="sr-only" id="scene-status" aria-live="polite"></p>

  <script type="module" src="src/main.js"></script>
</body>
</html>
